# Xcode loyihasi shu fayldan yasaladi (CI'da: xcodegen generate). .xcodeproj gitda saqlanmaydi.
name: YtLynx
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "15.0"
settings:
  base:
    # CocoaPods skriptlari uchun (Lynx hujjatidagi talab)
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  YtLynx:
    type: application
    platform: iOS
    sources:
      - path: YtLynx
      # Android bilan umumiy ko'prik — bitta fayl ikkala platformada
      - path: ../android/app/src/main/assets/yt-bridge.js
        buildPhase: resources
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: YT Lynx
        CFBundleShortVersionString: "0.1"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        # fonda ijro: ekran qulflanganda va boshqa ilovada ham ovoz davom etadi
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # ytlynx://open?url=... (Shortcuts orqali ulashish)
        CFBundleURLTypes:
          - CFBundleURLName: com.example.ytlynx
            CFBundleURLSchemes: [ytlynx]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.ytlynx
        PRODUCT_NAME: YtLynx
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_ENABLE_OBJC_ARC: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    scheme: {}
